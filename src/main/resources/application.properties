spring.application.name=deroyque

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deroyque}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:deroyque}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:deroyque}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=3000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Seguranca (OAuth 2.0 Resource Server) ---
# Chaves publicas do servidor de autorizacao (JWKS); emissor e audiencia sao validados em cada token.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWK_SET_URI:http://localhost:8090/default/jwks}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:8090/default}
spring.security.oauth2.resourceserver.jwt.audiences=${OAUTH_AUDIENCE:activation-service}
api.max-request-size=16KB

# --- Provedor externo ---
provider.base-url=${PROVIDER_BASE_URL:http://localhost:8089}
provider.connect-timeout=${PROVIDER_CONNECT_TIMEOUT:2s}
provider.read-timeout=${PROVIDER_READ_TIMEOUT:5s}
provider.api-key=${PROVIDER_API_KEY:}

# --- Processamento das ativacoes ---
activation.max-attempts=${ACTIVATION_MAX_ATTEMPTS:5}
activation.initial-backoff=${ACTIVATION_INITIAL_BACKOFF:2s}
activation.max-backoff=${ACTIVATION_MAX_BACKOFF:5m}
activation.batch-size=20
activation.stuck-after=2m
activation.dispatcher.poll-interval=1s
activation.dispatcher.stuck-check-interval=30s

# --- Observabilidade ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.pattern.correlation=[%X{correlationId:-}]
# Em producao: LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (logs JSON, MDC incluso)
