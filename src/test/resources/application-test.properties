# Banco em memoria (modo PostgreSQL), um por contexto Spring para isolar as classes de teste.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# O dispatcher so roda nos testes que exercitam o fluxo com o provedor.
activation.dispatcher.enabled=false
activation.dispatcher.poll-interval=100ms
activation.max-attempts=3
activation.initial-backoff=50ms
activation.max-backoff=200ms

provider.base-url=http://localhost:1
provider.connect-timeout=500ms
provider.read-timeout=500ms
