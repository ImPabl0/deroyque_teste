name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Build + todos os testes (o runner tem Docker, então os testes com Testcontainers também rodam)
      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t deroyque:${{ github.sha }} .
